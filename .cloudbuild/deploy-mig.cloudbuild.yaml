steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - '-c'
      - |
        set -euo pipefail

        echo "Deploying ${_SERVICE_NAME}, image tag: ${_IMAGE_TAG}"

        gcloud compute instance-groups managed all-instances-config update \
          "${_MIG_NAME}" \
          --zone="${_SERVICE_ZONE}" \
          --metadata="api-image-tag=${_IMAGE_TAG},frontend-image-tag=${_IMAGE_TAG}"

        echo "Waiting for ${_SERVICE_NAME} MIG rollout to complete and become healthy..."

        gcloud compute instance-groups managed wait-until \
          "${_MIG_NAME}" \
          --zone="${_SERVICE_ZONE}" \
          --stable \
          --timeout=1800

        gcloud compute instance-groups managed list-instances \
          "${_MIG_NAME}" \
          --zone="${_SERVICE_ZONE}" \
          --format="table(name,status,healthState,instanceTemplate,lastAttempt.errors)"

        echo "MIG is stable. Deployment complete."
    entrypoint: bash

options:
  logging: CLOUD_LOGGING_ONLY

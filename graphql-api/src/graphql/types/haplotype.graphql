type LRVariantPopulationFreq {
  id: String!
  af: Float!
}

type LRVariantFreq {
  af: Float!
  ac: Int!
  an: Int!
}

type LRVariant {
  variant_id: String!
  chrom: String!
  pos: Int!
  end: Int
  ref: String!
  alt: String!

  # Classification
  allele_type: String!
  allele_length: Int

  # Frequencies
  freq: LRVariantFreq
  populations: [LRVariantPopulationFreq!]

  # Annotations
  rsid: String
  major_consequence: String
  cadd_phred: Float
  phylop: Float
  filters: [String!]
  sv_consequences: [String!]

  # SV / TR specific
  tr_id: String
  tr_motifs: String
  gnomad_str: String
  dbsnp_id: String

  # Haplotype context (nullable — only populated in haplotype queries)
  allele_methylation: Float
  allele_purity: Float
  motif_counts: [Int!]
  in_samples: [String!]
  # Composite carrier membership. in_samples remains for legacy clients.
  in_haplotypes: [HaplotypeCarrierIdentity!]
  gt_phased: Boolean
}

type HaplotypeCarrierIdentity {
  sample_id: String!
  # Original one-based GT position from the source VCF. This is not a biological haplotype label.
  vcf_strand: Int!
  phase_set: String
}

type HaplotypeVariantSet {
  variants: [LRVariant!]!
  readable_id: String!
}

type HaplotypeSample {
  sample_id: String!
  # Original one-based GT position from the source VCF. This is not a biological haplotype label.
  vcf_strand: Int!
  # FORMAT/PS when one phase set describes this member; otherwise null.
  phase_set: String
  variant_sets: [HaplotypeVariantSet!]!
}

type HaplotypeGroup {
  samples: [HaplotypeSample!]!
  variants: HaplotypeVariantSet!
  below_threshold: HaplotypeVariantSet!
  start: Int!
  stop: Int!
  readable_id: String!
  hash: String!
}

type ClusterConsensusVariant {
  variant: LRVariant!
  cluster_af: Float!
}

type HaplotypeCluster {
  cluster_id: String!
  sample_count: Int!
  member_group_hashes: [String!]!
  consensus_variants: [ClusterConsensusVariant!]!
}

type HaplotypeGroups {
  groups: [HaplotypeGroup!]!
  clusters: [HaplotypeCluster!]
  tree_json: String
}

enum MethylationAvailabilityStatus {
  AVAILABLE_COMPLETE
  AVAILABLE_PARTIAL
  AVAILABLE_ORIENTATION_UNCONFIRMED
  UNAVAILABLE_INCOMPLETE
  UNAVAILABLE_NO_ASSAY_SOURCE
  UNAVAILABLE_NO_CHR22
  UNAVAILABLE_SOURCE_MARKED_SKIP
  UNAVAILABLE_NO_CONTIG
  UNAVAILABLE_ORIENTATION_UNCONFIRMED
  UNAVAILABLE_AOU_SUMMARY_ONLY
}

enum MethylationDataLayer {
  SAMPLE_TOTAL
  SOURCE_PHASED
}

enum MethylationSourceHaplotype {
  HAP1
  HAP2
}

enum MethylationOrientationStatus {
  NOT_APPLICABLE
  UNCONFIRMED
  CONFIRMED
}

type PhasedMethylationCapability {
  data_layer: MethylationDataLayer!
  available: Boolean!
  joinable_to_vcf: Boolean!
  status: MethylationAvailabilityStatus!
  orientation_status: MethylationOrientationStatus!
  phase_set_semantics: String!
  route_run_id: String
  source_sample_ids: [String!]!
  reason: String!
}

type MethylationSampleAvailability {
  sample_id: String!
  available: Boolean!
  status: MethylationAvailabilityStatus!
  reason: String
}

type MethylationRecord {
  chr: String!
  pos1: Int!
  pos2: Int!
  methylation: Float!
  sample: String!
  coverage: Int
  data_layer: MethylationDataLayer!
  # Source BED hap1/hap2 identity. It must remain distinct from vcf_strand.
  source_haplotype: MethylationSourceHaplotype
  # Null until an approved source-haplotype-to-VCF mapping exists.
  vcf_strand: Int
  phase_set: String
}

type MethylationSummaryRecord {
  chrom: String!
  pos1: Int!
  pos2: Int!
  mean_methylation: Float!
  mean_coverage: Float!
  num_samples: Int!
  std_methylation: Float
  min_methylation: Float
  max_methylation: Float
}

type MethylationOutlierSample {
  sample_id: String!
  outlier_count: Int!
  outlier_fraction: Float!
  direction: String!
}

type MethylationOutlierRanking {
  chrom: String!
  start: Int!
  stop: Int!
  total_cpg_sites: Int!
  total_samples: Int!
  samples: [MethylationOutlierSample!]!
}

type RecombinationRateRecord {
  start: Int!
  end: Int!
  value: Float!
}

type MQTLAssociation {
  variant_id: String!
  variant_pos: Int!
  cpg_pos: Int!
  p_value: Float!
  effect_size: Float!
  carrier_count: Int!
  non_carrier_count: Int!
}

enum LongReadDataSource {
  Y1_ACCEPTED
  Y1_DATABASE
  LEGACY_V1
  EXTERNAL_REFERENCE
  UNAVAILABLE
}

enum LongReadModality {
  PRIMARY_VARIANTS
  SAMPLE_METADATA
  HAPLOTYPES
  COVERAGE
  STR_HISTOGRAM
  METHYLATION
  SOURCE_PHASED_METHYLATION
  RECOMBINATION
}

type LongReadSourceProvenance {
  modality: LongReadModality!
  source: LongReadDataSource!
  database: String
  release: String
  cohort: LongReadCohort!
  reference_genome: String!
  chromosome: String!
  scope: String
  run_id: String
  status: String!
  available: Boolean!
  label: String
}

type LongReadY1Provenance {
  enabled: Boolean!
  scope_label: String!
  sources: [LongReadSourceProvenance!]!
}

type SampleMetadata {
  sample_id: String!
  subpopulation: String!
  superpopulation: String!
}

type STRHistogramPopulation {
  key: String!
  histogram: String!
}

type STRHistogramRecord {
  chrom: String!
  position: Int!
  end_position: Int!
  motif: String!
  allele_size_histogram: String!
  biallelic_histogram: String!
  min_repeats: Float
  mode_repeats: Float
  mean_repeats: Float
  stdev_repeats: Float
  median_repeats: Float
  p99_repeats: Float
  max_repeats: Float
  unique_allele_lengths: Int
  num_called_alleles: Int
  populations: [STRHistogramPopulation!]
}

enum StrQualityCategory {
  CLEAN
  BORDERLINE
  LEGIT_BINNED
  BOGUS_PURITY
  DEGENERATE_MOTIF
  SV_CONTAMINATION
  DELETION_BUG
}

type StrCatalogLocus {
  position: Int!
  chrom: String!
  trId: String!
  motifs: String!
  motifCount: Int!
  numHaplotypes: Int!
  distinctAlleleLengths: Int!
  minAlleleLen: Int!
  maxAlleleLen: Int!
  sizeRatio: Float
  avgPurity: Float!
  minPurity: Float!
  countBelow50Purity: Int!
  hasOverlargeSvOutlier: Boolean!
  hasDeletionBug: Boolean!
  category: StrQualityCategory!
}

extend type Query {
  sample_metadata(
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [SampleMetadata!]
  mqtl_associations(
    chrom: String!
    start: Int!
    stop: Int!
    min_af: Float
    max_distance: Int
    min_carriers: Int
  ): [MQTLAssociation!]

  haplotype_groups(
    chrom: String!
    start: Int!
    stop: Int!
    min_allele_freq: Float
    sort_by: String
    cluster_threshold: Float
  ): HaplotypeGroups

  methylation_sample_availability(
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [MethylationSampleAvailability!]!

  phased_methylation_capability(
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): PhasedMethylationCapability!

  source_phased_methylation(
    chrom: String!
    start: Int!
    stop: Int!
    sample_id: String!
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [MethylationRecord!]

  methylation(
    chrom: String!
    start: Int!
    stop: Int!
    samples: [String!]
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [MethylationRecord!]

  methylation_summary(
    chrom: String!
    start: Int!
    stop: Int!
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [MethylationSummaryRecord!]

  methylation_outliers(
    chrom: String!
    start: Int!
    stop: Int!
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): MethylationOutlierRanking

  recombination_rate(
    chrom: String!
    start: Int!
    stop: Int!
  ): [RecombinationRateRecord!]

  lr_coverage(
    chrom: String!
    start: Int!
    stop: Int!
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): [CoverageBin!]

  lr_str_histogram(
    chrom: String!
    position: Int!
    lr_cohort: LongReadCohort = hgsvc_hprc
  ): STRHistogramRecord

  long_read_y1_provenance(
    lr_cohort: LongReadCohort!
    chrom: String!
  ): LongReadY1Provenance!

  str_catalog(chrom: String!): [StrCatalogLocus!]

  str_catalog_haplotypes(chrom: String!): HaplotypeGroups
}

type LongReadTrShortReadCandidate {
  canonical_id: String!
  matched_component_index: Int!
  matched_component: LongReadTrLocusComponent!
  matched_reference_region_index: Int!
  source_record_count: Int!
  source_record_membership_sha256: String!
}

type LongReadTrReferenceDiagnosticSourceRecord {
  cohort: LongReadCohort!
  chrom: String!
  run_id: String!
  source_record_id: String!
  position: Int!
}

# A bounded nearby/related component for diagnosis only. It never authorizes
# catalog identity, a clinical range, or an exact-reference route.
type LongReadTrReferenceDiagnosticCandidate {
  canonical_id: String!
  ordered_component_index: Int!
  ordered_component: LongReadTrLocusComponent!
  motif_relation: String!
  source_record_count: Int!
  source_record_membership_sha256: String!
  source_records: [LongReadTrReferenceDiagnosticSourceRecord!]!
  source_records_truncated: Boolean!
}

type LongReadTrShortReadContext {
  status: LongReadTrShortReadContextStatus!
  reason_code: String
  catalog_dataset: DatasetId!
  catalog_source: String!
  catalog_digest: String!
  catalog_record: ShortTandemRepeatDetails
  matched_component_index: Int
  matched_component: LongReadTrLocusComponent
  matched_reference_region_index: Int
  exact_reference_component_outline_authorized: Boolean!
  matched_reference_repeat_unit_classifications: [String!]!
  pathogenic_component_highlight: Boolean!
    @deprecated(
      reason: "Use exact_reference_component_outline_authorized for neutral reference identity"
    )
  candidates: [LongReadTrShortReadCandidate!]!
  lr_database: String
  lr_release: String
  lr_run_id: String
  lr_cohort: LongReadCohort
}

type LongReadTrReferenceShortRecord {
  id: String!
  gene: ShortTandemRepeatGene!
  associated_diseases: [ShortTandemRepeatAssociatedDisease!]!
  stripy_id: String
  strchive_id: String
  main_reference_region: ShortTandemRepeatReferenceRegion!
  reference_repeat_unit: String!
}

type LongReadTrReferenceCohortResult {
  status: LongReadTrReferenceStatus!
  reason_code: String
  proof_text: String!
  source_database: String!
  source_release: String!
  source_run_id: String!
  canonical_ids: [String!]!
  # Exact authorization candidates. Empty for every non-EXACT_UNIQUE status.
  candidates: [LongReadTrShortReadCandidate!]!
  # Bounded diagnosis only; never an exact or clinical/reference match.
  diagnostic_candidates: [LongReadTrReferenceDiagnosticCandidate!]!
  diagnostic_candidate_identity_count: Int!
  diagnostic_candidates_truncated: Boolean!
  diagnostic_candidate_identity_sha256: String!
}

type LongReadTrReferenceNode {
  # Flat compact fields are the stable index contract. short_record is retained
  # as a structured compatibility view over the same artifact bytes.
  id: String!
  gene_symbol: String
  reference_region: ShortTandemRepeatReferenceRegion!
  reference_repeat_unit: String!
  associated_diseases: [ShortTandemRepeatAssociatedDisease!]!
  short_record: LongReadTrReferenceShortRecord!
  hgsvc_hprc: LongReadTrReferenceCohortResult!
  aou: LongReadTrReferenceCohortResult!
}

type LongReadTrReferencePageInfo {
  has_next_page: Boolean!
  end_cursor: String
}

type LongReadTrReferenceProvenance {
  dataset: DatasetId!
  source: String!
  endpoint: String!
  queried_at: String!
  row_count: Int!
  compact_sha256: String!
  hard_ceiling: Int!
  reference_genome: String!
  coordinate_system: String!
  motif_identity: String!
  catalog_available: Boolean!
  catalog_unavailable_reason: String
  snapshot_contract_id: String!
  snapshot_contract_label: String!
  snapshot_contract_scope: String!
  snapshot_approval_state: String!
  current_trexplorer_admitted: Boolean!
  admitted_component_index_complete: Boolean!
  admitted_component_index_database: String!
  admitted_component_index_release: String!
  admitted_component_index_source_count: Int!
  admitted_component_index_source_record_count: Int!
  admitted_component_index_canonical_locus_count: Int!
  admitted_component_index_ordered_component_count: Int!
  admitted_component_index_inventory_sha256: String!
  diagnostic_max_candidates_per_status: Int!
  diagnostic_max_source_records_per_candidate: Int!
}

type LongReadTrReferenceConnection {
  nodes: [LongReadTrReferenceNode!]!
  total_count: Int!
  page_info: LongReadTrReferencePageInfo!
  provenance: LongReadTrReferenceProvenance!
}

enum LongReadTrShortReadDistributionStatus {
  AVAILABLE
  NONE
  UNAVAILABLE
}

enum LongReadTrShortReadDistributionPartStatus {
  AVAILABLE
  UNAVAILABLE
}

type LongReadTrShortReadAlleleDistributionPart {
  status: LongReadTrShortReadDistributionPartStatus!
  reason_code: String
  source_rows: Int
  source_bins: Int
  returned_rows: Int!
  returned_bins: Int!
  serialized_bytes: Int!

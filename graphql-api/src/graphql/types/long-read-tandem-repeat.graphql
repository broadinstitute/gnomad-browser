  reason_code: LongReadTrPrimaryMotifMeasurementReason
  motif: String
  biological_role: String
  metric: String!
  unit: LongReadTrPrimaryMotifMeasurementUnit!
  scope: LongReadTrPrimaryMotifMeasurementScope!
  called_alleles: Int
  reference_alleles: Int
  alternate_alleles: Int
  alternate_identities_checked: Int

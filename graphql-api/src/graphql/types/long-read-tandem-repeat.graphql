type LongReadTrLocusComponent {
  chrom: String!
  start0: Int!
  end0: Int!
  motif: String!
}

type LongReadTrLocusRegion {
  chrom: String!
  start0: Int!
  end0: Int!
  size: Int!
}

enum LongReadTrPrimaryRepeatStatus {
  AVAILABLE
  UNAVAILABLE
}

enum LongReadTrPrimaryRepeatReason {
  IDENTITY_CONTEXT_UNAVAILABLE
  WRONG_ASSEMBLY
  INVALID_STORED_MOTIF
  MAIN_REGION_NOT_EXACT_COMPONENT
  STORED_MOTIF_NOT_EXACT_COMPONENT
  NON_BIJECTIVE_COMPONENT
  CATALOG_DIGEST_MISMATCH
  REGISTRY_DIGEST_MISMATCH
  REGISTRY_NOT_REVIEWED
  REGISTRY_IDENTITY_MISMATCH
  COMPOUND_PRIMARY_REPEAT_UNREVIEWED
}

enum LongReadTrPrimaryRepeatSelectionBasis {
  EXACT_MAIN_CATALOG_COMPONENT
  LR_SOLE_COMPONENT
  # Reserved for a future reviewed override registry. No current entries are available.
  REVIEWED_PRIMARY_REPEAT_REGISTRY
}

type LongReadTrPrimaryRepeat {
  status: LongReadTrPrimaryRepeatStatus!
  reason_code: LongReadTrPrimaryRepeatReason
  motif: String
  component_index: Int
  component: LongReadTrLocusComponent
  selection_basis: LongReadTrPrimaryRepeatSelectionBasis
  # Optional source-backed role; no coding role is inferred from motif or gene identity.
  biological_role: String
  catalog_id: String
  # Present only for exact catalog authorization; null for sole-component and registry bases.
  catalog_digest: String
  # Present only for a future reviewed registry authorization; null for all current identities.
  registry_digest: String
}

type LongReadTrSourceRecord {
  record_index: Int!
  source_variant_id: String!
  task_id: String
  attempt_id: String
  position: Int!
  alt_count: Int!
  ref: String
  non_reference_ac: Int!
  an: Int!
  non_reference_af: Float!
  source: String
  region: String
}

# Bounded exact-ALT index node. REF/ALT are returned only when the complete
# locus sequence index fits the aggregate response bound.
type LongReadTrAllele {
  variant_id: String!
  source_variant_id: String!
  alt_index: Int!
  alt_count: Int!
  ref: String
  alt: String
  length: Int
  repeat_count: Float
  repeat_count_source: String
  motif_purity: Float
  freq: LongReadVariantFrequencies!
}

type LongReadTrSelectedAllele {
  variant_id: String!
  source_variant_id: String!
  alt_index: Int!
  alt_count: Int!
  ref: String!
  alt: String!
  length: Int
  repeat_count: Float
  repeat_count_source: String
  motif_purity: Float
  motif_purity_source: String
  decomposition_status: String!
  decomposition_reason: String!
  freq: LongReadVariantFrequencies!
  rsids: [String!]!
  filters: [String!]!
  major_consequence: String
  cadd_phred: Float
  phylop: Float
  short_read_match_id: String
  short_read_match_type: String
  short_read_match_source: String
  source_release: String!
  source_run_id: String!
}

type LongReadTrPageInfo {
  has_next_page: Boolean!
  end_cursor: String
}

type LongReadTrAlleleConnection {
  nodes: [LongReadTrAllele!]!
  page_info: LongReadTrPageInfo!
}

type LongReadTrCatalogMatch {
  id: String!
  gene_symbol: String
  reference_repeat_unit: String!
  stripy_id: String
  strchive_id: String
}

enum LongReadTrShortReadContextStatus {
  EXACT_UNIQUE
  NONE
  MULTIPLE
  AMBIGUOUS
  AMBIGUOUS_CATALOG
  AMBIGUOUS_COMPONENT
  CATALOG_UNAVAILABLE
  UNAVAILABLE
}

enum LongReadTrReferenceStatus {
  EXACT_UNIQUE
  AMBIGUOUS
  COORDINATE_MISMATCH
  ORIENTATION_DIAGNOSTIC
  MOTIF_MISMATCH
  SOURCE_ABSENT
  UNAVAILABLE
}

enum LongReadTrReferenceMatchFilter {
  ALL
  EITHER
  BOTH
  HGSVC_HPRC_ONLY
  AOU_ONLY
  NONE
  MULTIPLE
  UNAVAILABLE_OR_AMBIGUOUS
}

enum LongReadTrReferenceSort {
  SHORT_ID_ASC
  GENOMIC_ASC
  MOTIF_ASC
  HGSVC_HPRC_STATUS
  AOU_STATUS

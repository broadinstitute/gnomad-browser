type LongReadTrLocusComponent {
  chrom: String!
  start0: Int!
  end0: Int!
  motif: String!
}

type LongReadTrLocusRegion {
  chrom: String!
  start0: Int!
  end0: Int!
  size: Int!
}

type LongReadTrSourceRecord {
  record_index: Int!
  source_variant_id: String!
  task_id: String
  attempt_id: String
  position: Int!
  alt_count: Int!
  ref: String
  non_reference_ac: Int!
  an: Int!
  non_reference_af: Float!
  source: String
  region: String
}

# Bounded exact-ALT index node. REF/ALT are returned only when the complete
# locus sequence index fits the aggregate response bound.
type LongReadTrAllele {
  variant_id: String!
  source_variant_id: String!
  alt_index: Int!
  alt_count: Int!
  ref: String
  alt: String
  length: Int
  repeat_count: Float
  repeat_count_source: String
  motif_purity: Float
  freq: LongReadVariantFrequencies!
}

type LongReadTrSelectedAllele {
  variant_id: String!
  source_variant_id: String!
  alt_index: Int!
  alt_count: Int!
  ref: String!
  alt: String!
  length: Int
  repeat_count: Float
  repeat_count_source: String
  motif_purity: Float
  motif_purity_source: String
  decomposition_status: String!
  decomposition_reason: String!
  freq: LongReadVariantFrequencies!
  rsids: [String!]!
  filters: [String!]!
  major_consequence: String
  cadd_phred: Float
  phylop: Float
  short_read_match_id: String
  short_read_match_type: String
  short_read_match_source: String
  source_release: String!
  source_run_id: String!
}

type LongReadTrPageInfo {
  has_next_page: Boolean!
  end_cursor: String
}

type LongReadTrAlleleConnection {
  nodes: [LongReadTrAllele!]!
  page_info: LongReadTrPageInfo!
}

type LongReadTrCatalogMatch {
  id: String!
  gene_symbol: String
  reference_repeat_unit: String!
  stripy_id: String
  strchive_id: String
}

enum LongReadTrShortReadContextStatus {
  EXACT_UNIQUE
  NONE
  AMBIGUOUS_CATALOG
  AMBIGUOUS_COMPONENT
  CATALOG_UNAVAILABLE
}

enum LongReadTrReferenceStatus {
  EXACT_UNIQUE
  NONE
  MULTIPLE
  AMBIGUOUS_CATALOG
  AMBIGUOUS_COMPONENT
  UNAVAILABLE
}

enum LongReadTrReferenceMatchFilter {
  ALL
  EITHER
  BOTH
  HGSVC_HPRC_ONLY
  AOU_ONLY
  NONE
  MULTIPLE
  UNAVAILABLE_OR_AMBIGUOUS
}

enum LongReadTrReferenceSort {
  SHORT_ID_ASC
  GENOMIC_ASC
  MOTIF_ASC
  HGSVC_HPRC_STATUS
  AOU_STATUS
}

type LongReadTrShortReadCandidate {
  canonical_id: String!
  matched_component_index: Int!
  matched_component: LongReadTrLocusComponent!
  matched_reference_region_index: Int!
}

type LongReadTrShortReadContext {
  status: LongReadTrShortReadContextStatus!
  reason_code: String
  catalog_dataset: DatasetId!
  catalog_source: String!
  catalog_digest: String!
  catalog_record: ShortTandemRepeatDetails
  matched_component_index: Int
  matched_component: LongReadTrLocusComponent
  matched_reference_region_index: Int
  pathogenic_component_highlight: Boolean!
  candidates: [LongReadTrShortReadCandidate!]!
  lr_database: String
  lr_release: String
  lr_run_id: String
  lr_cohort: LongReadCohort
}

type LongReadTrReferenceShortRecord {
  id: String!
  gene: ShortTandemRepeatGene!
  associated_diseases: [ShortTandemRepeatAssociatedDisease!]!
  stripy_id: String
  strchive_id: String
  main_reference_region: ShortTandemRepeatReferenceRegion!
  reference_repeat_unit: String!
}

type LongReadTrReferenceCohortResult {
  status: LongReadTrReferenceStatus!
  reason_code: String
  source_database: String!
  source_release: String!
  source_run_id: String!
  canonical_ids: [String!]!
  candidates: [LongReadTrShortReadCandidate!]!
}

type LongReadTrReferenceNode {
  # Flat compact fields are the stable index contract. short_record is retained
  # as a structured compatibility view over the same artifact bytes.
  id: String!
  gene_symbol: String
  reference_region: ShortTandemRepeatReferenceRegion!
  reference_repeat_unit: String!
  associated_diseases: [ShortTandemRepeatAssociatedDisease!]!
  short_record: LongReadTrReferenceShortRecord!
  hgsvc_hprc: LongReadTrReferenceCohortResult!
  aou: LongReadTrReferenceCohortResult!
}

type LongReadTrReferencePageInfo {
  has_next_page: Boolean!
  end_cursor: String
}

type LongReadTrReferenceProvenance {
  dataset: DatasetId!
  source: String!
  endpoint: String!
  queried_at: String!
  row_count: Int!
  compact_sha256: String!
  hard_ceiling: Int!
  reference_genome: String!
  coordinate_system: String!
  motif_identity: String!
  catalog_available: Boolean!
  catalog_unavailable_reason: String
}

type LongReadTrReferenceConnection {
  nodes: [LongReadTrReferenceNode!]!
  total_count: Int!
  page_info: LongReadTrReferencePageInfo!
  provenance: LongReadTrReferenceProvenance!
}

enum LongReadTrPlotStatus {
  AVAILABLE_EXACT
  UNAVAILABLE_ANCILLARY
  UNAVAILABLE_COMPOUND_LOCUS
  UNAVAILABLE_MULTIPLE_SOURCE_RECORDS
  UNAVAILABLE_NO_EXACT_MAPPING
}

enum LongReadTrHistogramUnit {
  MOTIF_REPEAT_COUNT
}

type LongReadTrHistogramIdentity {
  ancillary_run_id: String!
  primary_database: String!
  primary_run_id: String!
  primary_task_id: String!
  primary_attempt_id: String!
  source_variant_id: String!
  component: LongReadTrLocusComponent!
}

type LongReadTrPlotCallability {
  called_alleles: Int!
  called_diploid_genotypes: Int
  no_call_rate: Float
  no_call_rate_status: String!
}

type LongReadTrPlotStratumCallability {
  ancestry_group: String!
  sex: String!
  called_alleles: Int
  called_diploid_genotypes: Int
  no_call_rate: Float
  no_call_rate_status: String!
}

type LongReadTrRepeatCountPlots {
  status: LongReadTrPlotStatus!
  reason_code: String
  identity: LongReadTrHistogramIdentity
  unit: LongReadTrHistogramUnit
  repeat_unit: String
  overall: LongReadTrPlotCallability
  callability: [LongReadTrPlotStratumCallability!]!
  allele_size_distribution: [ShortTandemRepeatAlleleSizeDistributionCohort!]!
  genotype_distribution: [ShortTandemRepeatGenotypeDistributionCohort!]!
  max_repunits: Float
}

enum LongReadTrDataStatus {
  AVAILABLE
  UNAVAILABLE
}

enum LongReadTrWholeRecordUnit {
  WHOLE_RECORD_DELTA_BP
}

type LongReadTrAlleleStack {
  ancestry_group: String
  sex: String
  called_alleles: Int!
}

type LongReadTrAlleleBin {
  delta: Int!
  called_alleles: Int!
  exact_alt_count: Int!
  allele_ids: [String!]!
  stacks: [LongReadTrAlleleStack!]!
}

type LongReadTrPurityPoint {
  allele_id: String!
  delta: Int!
  motif_purity: Float!
  called_alleles: Int!
}

type LongReadTrWholeRecordAlleleLandscape {
  status: LongReadTrDataStatus!
  reason_code: String
  unit: LongReadTrWholeRecordUnit!
  called_alleles: Int
  non_reference_called_alleles: Int
  reference_called_alleles: Int
  exact_alt_count: Int
  stratified_available: Boolean
  stratified_unavailable_reason: String
  ancestry_groups: [String!]
  sexes: [String!]
  bins: [LongReadTrAlleleBin!]
  purity_points: [LongReadTrPurityPoint!]
  purity_available: Boolean
  purity_unavailable_reason: String
}

type LongReadTrGenotypePair {
  shorter_allele_id: String!
  longer_allele_id: String!
  ancestry_group: String!
  sex: String!
  people: Int!
  phased_people: Int!
  unphased_people: Int!
}

type LongReadTrGenotypeCell {
  shorter_delta: Int!
  longer_delta: Int!
  people: Int!
  pairs: [LongReadTrGenotypePair!]!
}

type LongReadTrWholeRecordGenotypeLandscape {
  status: LongReadTrDataStatus!
  reason_code: String
  unit: LongReadTrWholeRecordUnit!
  reference_allele_id: String
  called_samples: Int
  called_alleles: Int
  ancestry_groups: [String!]
  sexes: [String!]
  cells: [LongReadTrGenotypeCell!]
}

type LongReadTandemRepeatLocus {
  id: String!
  source_trid: String!
  reference_genome: ReferenceGenomeId!
  chrom: String!
  region: LongReadTrLocusRegion!
  components: [LongReadTrLocusComponent!]!
  motifs: [String!]!
  structure: String
  lr_cohort: LongReadCohort!
  source_release: String!
  source_run_id: String!
  source_records: [LongReadTrSourceRecord!]!
  total_alleles: Int!
  exact_alt_count: Int!
  exact_alt_count_complete: Boolean!
  exact_alt_count_unavailable_reason: String
  delta_min: Int
  delta_max: Int
  delta_unavailable_reason: String
  called_allele_count: Int
  called_sample_count: Int
  unique_carrier_count: Int
  # Complete exact-index REF/ALT payload; selected detail has an independent byte bound below.
  sequences_available: Boolean!
  sequences_unavailable_reason: String
  selected_allele_valid: Boolean
  # Detail is all-or-nothing under its independent byte bound; compact index metadata remains.
  selected_allele_unavailable_reason: String
  selected_allele: LongReadTrSelectedAllele
  whole_record_allele_landscape: LongReadTrWholeRecordAlleleLandscape!
  whole_record_genotype_landscape: LongReadTrWholeRecordGenotypeLandscape!
  component_measurement_available: Boolean!
  component_measurement_unavailable_reason: String
  short_read_context: LongReadTrShortReadContext!
  # Deprecated compatibility field; resolved from the same exact, validated context.
  short_read_matches: [LongReadTrCatalogMatch!]!
  repeat_count_plots: LongReadTrRepeatCountPlots!
  alleles: LongReadTrAlleleConnection!
}

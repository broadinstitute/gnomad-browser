}

type LongReadTandemRepeatLocus {
  id: String!
  source_trid: String!
  reference_genome: ReferenceGenomeId!
  chrom: String!
  region: LongReadTrLocusRegion!
  components: [LongReadTrLocusComponent!]!
  motifs: [String!]!
  structure: String
  lr_cohort: LongReadCohort!
  source_release: String!
  source_run_id: String!
  source_records: [LongReadTrSourceRecord!]!
  total_alleles: Int!
  exact_alt_count: Int!
  exact_alt_count_complete: Boolean!
  exact_alt_count_unavailable_reason: String
  delta_min: Int
  delta_max: Int
  delta_unavailable_reason: String
  represented_allele_length_min: Int
  represented_allele_length_max: Int
  represented_allele_length_unavailable_reason: String
  called_allele_count: Int
  called_sample_count: Int
  unique_carrier_count: Int
  # Complete exact-index REF/ALT payload; selected detail has an independent byte bound below.
  sequences_available: Boolean!
  sequences_unavailable_reason: String
  selected_allele_valid: Boolean
  # Detail is all-or-nothing under its independent byte bound; compact index metadata remains.
  selected_allele_unavailable_reason: String
  selected_allele: LongReadTrSelectedAllele
  whole_record_allele_landscape: LongReadTrWholeRecordAlleleLandscape!
  whole_record_genotype_landscape: LongReadTrWholeRecordGenotypeLandscape!
  component_measurement_available: Boolean!
  component_measurement_unavailable_reason: String
  primary_repeat: LongReadTrPrimaryRepeat!
  primary_motif_measurement: LongReadTrPrimaryMotifMeasurement!
  short_read_context: LongReadTrShortReadContext!
  # Deprecated compatibility field; resolved from the same exact, validated context.
  short_read_matches: [LongReadTrCatalogMatch!]!
  repeat_count_plots: LongReadTrRepeatCountPlots!
  alleles: LongReadTrAlleleConnection!
}

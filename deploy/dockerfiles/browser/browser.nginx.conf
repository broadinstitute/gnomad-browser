# Pass in the W3C traceparent header ($http_traceparent).
# Try to extract a valid 32-character trace ID and set it as
# $traceparent_trace_id.
# Matches: 00-<32 hex>-<16 hex>-<2 hex>.
# Capture group 1 (inside parentheses) is the trace ID.
# If there is no valid match, the map value is empty.
map $http_traceparent $traceparent_trace_id {
    default "";
    "~*^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
}

# Pass in Google's legacy trace context header ($http_x_cloud_trace_context).
# Try to extract a valid 32-character trace ID and set it as $cloud_trace_id.
# Matches: <32 hex>, followed by "/" and legacy span ID and options.
# Capture group 1 (inside parentheses) is the trace ID.
# If there is no valid match, the map value is empty.
map $http_x_cloud_trace_context $cloud_trace_id {
    default "";
    "~*^([0-9a-f]{32})(?:/|$)" $1;
}

# Combine the trace IDs extracted above, preferring the W3C trace ID when both
# formats are present.
# The combined value has the form "<traceparent-trace-id>:<cloud-trace-id>".
# Match either a W3C trace ID before the colon or, if absent, a legacy
# Cloud Trace ID after the colon. Set the result as $gcp_trace_id.
map "$traceparent_trace_id:$cloud_trace_id" $gcp_trace_id {
    default "";
    "~^([0-9a-f]{32}):" $1;
    "~^:([0-9a-f]{32})$" $1;
}

# Combine GCP_PROJECT and the extracted trace ID.
# Only construct a complete GCP trace resource when both the project 
# and trace ID are available.
# The resulting value is suitable for
# logging.googleapis.com/trace: "projects/<project>/traces/<trace-id>".
map "$GCP_PROJECT:$gcp_trace_id" $gcp_trace {
    default "";
    "~^([^:]+):([0-9a-f]{32})$" "projects/$1/traces/$2";
}

# Log access information in JSON format so that individual fields can
# be queried in Stackdriver.
log_format json_combined escape=json
'{'
'"logging.googleapis.com/trace":"$gcp_trace",'
'"httpRequest":{'
'"requestMethod":"$request_method",'
'"requestUrl":"$scheme://$host$request_uri",'
'"status":"$status",'
'"responseSize":$bytes_sent,'
'"userAgent":"$http_user_agent",'
'"remoteIp":"$remote_addr",'
'"referer":"$http_referer",'
'"latency":"${request_time}s",'
'"protocol":"$server_protocol",'
'"cache_status":"$upstream_cache_status"'
'}'
'}';

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=gnomadCache:30m max_size=16g inactive=30d;

server {
  listen 80 default_server;

  access_log /var/log/nginx/access.log json_combined;

  # Use relative URLs for redirects
  # Since requests come in through a load balancer, the host/port known
  # to nginx is not necessarily the same as what the client connects to
  absolute_redirect off;

  # Set request's remote address to actual client IP
  # The request is forwarded through a GCE load balancer and possibly
  # other GKE nodes before reaching the browser pod
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  $REAL_IP_CONFIG

  # Health check endpoints
  location = /health/ready {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  ###############
  # GraphQL API #
  ###############

  location /api/ {
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
      application/json;

    # Proxy requests to api container
    # $API_URL is replaced at runtime with the API_URL environment variable.
    proxy_pass $API_URL;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Cloud-Trace-Context $http_x_cloud_trace_context;
    proxy_set_header traceparent $http_traceparent;

    include /etc/nginx/browser.proxy_cache.conf;
  }

  location = /api {
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
      application/json;

    # Proxy requests to api container
    # $API_URL is replaced at runtime with the API_URL environment variable.
    proxy_pass $API_URL;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Cloud-Trace-Context $http_x_cloud_trace_context;
    proxy_set_header traceparent $http_traceparent;

    include /etc/nginx/browser.proxy_cache.conf;
  }

  ###########
  # Browser #
  ###########
  location / {
    root /usr/share/nginx/html;

    # Rewrite rules here should match routes listed in browser/src/Routes.js
    rewrite ^/gene/[^/]+/?$ /index.html last;
    rewrite ^/gene/[^/]+/transcript/[^/]+/?$ /index.html last;
    rewrite ^/transcript/[^/]+/?$ /index.html last;
    rewrite ^/region/[^/]+/?$ /index.html last;
    rewrite ^/variant/liftover/[^/]/[^/]/[^/]+/?$ /index.html last;
    rewrite ^/variant/[^/]+/?$ /index.html last;
    rewrite ^/variant-cooccurrence/?$ /index.html last;
    rewrite ^/short-tandem-repeat/[^/]+/?$ /index.html last;
    rewrite ^/short-tandem-repeats/?$ /index.html last;

    rewrite ^/about/?$ /index.html last;
    rewrite ^/federated/?$ /index.html last;
    rewrite ^/team/?$ /index.html last;
    rewrite ^/stats/?$ /index.html last;
    rewrite ^/policies/?$ /index.html last;
    rewrite ^/downloads/?$ /index.html last;
    rewrite ^/terms/?$ /index.html last;
    rewrite ^/publications/?$ /index.html last;
    rewrite ^/contact/?$ /index.html last;
    rewrite ^/mou/?$ /index.html last;
    rewrite ^/faq/?$ /index.html last;
    rewrite ^/help/how-should-i-cite-discoveries-made-using-gnomad-data$ /publications last;
    rewrite ^/help/?$ /index.html last;
    rewrite ^/help/[^/]+/?$ /index.html last;
    rewrite ^/awesome/?$ /index.html last;

    try_files $uri $uri/ =404;

    error_page 404 /index.html;

    gzip_static on;

    # Required for gzip_static to work behind GCP load balancer
    gzip_proxied any;

    # https://github.com/h5bp/server-configs-nginx/blob/master/h5bp/web_performance/compression.conf
    gzip_types
      application/atom+xml
      application/geo+json
      application/javascript
      application/x-javascript
      application/json
      application/ld+json
      application/manifest+json
      application/rdf+xml
      application/rss+xml
      application/vnd.ms-fontobject
      application/wasm
      application/x-web-app-manifest+json
      application/xhtml+xml
      application/xml
      font/eot
      font/otf
      font/ttf
      image/bmp
      image/svg+xml
      text/cache-manifest
      text/calendar
      text/css
      text/javascript
      text/markdown
      text/plain
      text/xml
      text/vcard
      text/vnd.rim.location.xloc
      text/vtt
      text/x-component
      text/x-cross-domain-policy;

    expires -1y;
    add_header Pragma "no-cache";

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json)$ {
      expires 1w;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}

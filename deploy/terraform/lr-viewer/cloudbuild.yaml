steps:
  - name: 'bash:5.2.37@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324'
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ '${_TAG}' =~ ^fullgenome-[0-9a-f]{12}-[0-9]{8}t[0-9]{6}z$ ]]
        [[ '${_SOURCE_SHA}' =~ ^[0-9a-f]{40}$ ]]
        [[ '${_CREATED}' =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
        [[ '${_ROUTING_MANIFEST_SHA256}' =~ ^[0-9a-f]{64}$ ]]
        [[ '${_LR_Y1_ENABLED}' == true ]]
  - name: 'gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg=LR_Y1_ENABLED=${_LR_Y1_ENABLED}'
      - '--label=org.opencontainers.image.created=${_CREATED}'
      - '--label=org.opencontainers.image.revision=${_SOURCE_SHA}'
      - '--label=org.opencontainers.image.source=https://github.com/broadinstitute/gnomad-browser'
      - '--label=org.gnomad.lr.routing-manifest.sha256=${_ROUTING_MANIFEST_SHA256}'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - '${_IMAGE}:${_TAG}'
      - '.'
images:
  - '${_IMAGE}:${_TAG}'
options:
  requestedVerifyOption: VERIFIED
substitutions:
  _DOCKERFILE: 'deploy/dockerfiles/browser/api.dockerfile'
  _IMAGE: 'us-docker.pkg.dev/gnomadev/gnomad/gnomad-lr-api'
  _TAG: 'must-be-overridden'
  _SOURCE_SHA: 'must-be-overridden'
  _CREATED: 'must-be-overridden'
  _ROUTING_MANIFEST_SHA256: 'must-be-overridden'
  _LR_Y1_ENABLED: 'true'

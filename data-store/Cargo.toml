[package]
name = "gnomad-data-store"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
datafusion = "55.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_arrow = { version = "0.15.1", features = ["arrow-59"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny panics
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
